<svg width="1280" height="700" viewBox="0 0 1280 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }
    </style>
    <filter id="card-shadow" x="-4%" y="-2%" width="108%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.03"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="700" fill="#F8FAFC"/>

  <!-- ==================== HEADER ==================== -->
  <g id="Header">
    <!-- Main Title -->
    <text x="36" y="60" font-size="22" font-weight="700" fill="#0F172A">企业级 RAG 效果验收与评测体系 (Evaluation Matrix)</text>
    
    <!-- Subtitle -->
    <text x="36" y="84" font-size="12" fill="#64748B">理想验收标准方案（正式目标需在取得线上基线后校准） ·  区分【上线前离线门禁】与【上线后生产监控】</text>

    <!-- Right Top Badges -->
    <g transform="translate(780, 50)">
      <rect x="0" y="0" width="144" height="28" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#2563EB"/>
      <text x="24" y="18" font-size="11" font-weight="600" fill="#2563EB">200+ 离线测试集基线</text>

      <rect x="154" y="0" width="138" height="28" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
      <circle cx="168" cy="14" r="4" fill="#059669"/>
      <text x="178" y="18" font-size="11" font-weight="600" fill="#059669">三层防幻觉拦截</text>

      <rect x="302" y="0" width="162" height="28" rx="14" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
      <circle cx="316" cy="14" r="4" fill="#7C3AED"/>
      <text x="326" y="18" font-size="11" font-weight="600" fill="#7C3AED">线上日志持续校准飞轮</text>
    </g>

    <line x1="36" y1="106" x2="1244" y2="106" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- ==================== COLUMN 1 ==================== -->
  <g id="Column 1 - Accuracy &amp; Faithfulness">
    <!-- Card Container -->
    <rect x="36" y="124" width="392" height="512" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)"/>
    
    <!-- Header -->
    <rect x="52" y="140" width="24" height="24" rx="6" fill="#EFF6FF"/>
    <path d="M64 146L68 150L60 158" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="152" font-size="15" font-weight="700" fill="#0F172A">A. 准确性与防幻觉</text>
    <text x="84" y="165" font-size="10" fill="#94A3B8">Accuracy &amp; Faithfulness</text>
    
    <rect x="332" y="141" width="80" height="22" rx="11" fill="#FEE2E2" stroke="#FECACA" stroke-width="1"/>
    <text x="344" y="156" font-size="10" font-weight="700" fill="#DC2626">发版门禁 P0</text>
    <line x1="52" y1="174" x2="412" y2="174" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Row 1: Recall@5 -->
    <g transform="translate(52, 184)">
      <text x="0" y="12" font-size="13" font-weight="600" fill="#0F172A">检索 Recall@5</text>
      <rect x="116" y="0" width="68" height="16" rx="4" fill="#F1F5F9"/>
      <text x="122" y="12" font-size="9.5" fill="#475569">离线自动比对</text>
      <text x="360" y="13" font-size="15" font-weight="700" fill="#2563EB" text-anchor="end">≥ 90%</text>
      <text x="0" y="28" font-size="10.5" fill="#64748B">标准答案对应条款进入前 5 条候选切片，确保输入完整。</text>
      <rect x="0" y="36" width="360" height="4" rx="2" fill="#F1F5F9"/>
      <rect x="0" y="36" width="324" height="4" rx="2" fill="#2563EB"/>
    </g>

    <!-- Row 2: Faithfulness -->
    <g transform="translate(52, 238)">
      <text x="0" y="12" font-size="13" font-weight="600" fill="#0F172A">引用准确率 (事实忠实度)</text>
      <rect x="154" y="0" width="86" height="16" rx="4" fill="#F1F5F9"/>
      <text x="160" y="12" font-size="9.5" fill="#475569">LLM-as-a-Judge</text>
      <text x="360" y="13" font-size="15" font-weight="700" fill="#059669" text-anchor="end">≥ 95%</text>
      <text x="0" y="28" font-size="10.5" fill="#64748B">引用条款确实支持生成的结论，坚决杜绝断章取义与无据捏造。</text>
      <rect x="0" y="36" width="360" height="4" rx="2" fill="#F1F5F9"/>
      <rect x="0" y="36" width="342" height="4" rx="2" fill="#059669"/>
    </g>

    <!-- Row 3: Anti-Hallucination -->
    <g transform="translate(52, 292)">
      <text x="0" y="12" font-size="13" font-weight="600" fill="#0F172A">有依据回答率 (抗幻觉能力)</text>
      <rect x="164" y="0" width="76" height="16" rx="4" fill="#F1F5F9"/>
      <text x="170" y="12" font-size="9.5" fill="#475569">交叉事实校验</text>
      <text x="360" y="13" font-size="15" font-weight="700" fill="#059669" text-anchor="end">≥ 90%</text>
      <text x="0" y="28" font-size="10.5" fill="#64748B">回答核心结论可在引用原文中找到原话或依据，杜绝模型私货。</text>
      <rect x="0" y="36" width="360" height="4" rx="2" fill="#F1F5F9"/>
      <rect x="0" y="36" width="324" height="4" rx="2" fill="#059669"/>
    </g>

    <!-- Row 4: Refusal Accuracy -->
    <g transform="translate(52, 346)">
      <text x="0" y="12" font-size="13" font-weight="600" fill="#0F172A">无答案正确拒答率</text>
      <rect x="122" y="0" width="76" height="16" rx="4" fill="#F1F5F9"/>
      <text x="128" y="12" font-size="9.5" fill="#475569">超纲负用例库</text>
      <text x="360" y="13" font-size="15" font-weight="700" fill="#2563EB" text-anchor="end">≥ 90%</text>
      <text x="0" y="28" font-size="10.5" fill="#64748B">知识库无依据或低置信度时，主动说明无法确认，诚实不硬编。</text>
      <rect x="0" y="36" width="360" height="4" rx="2" fill="#F1F5F9"/>
      <rect x="0" y="36" width="324" height="4" rx="2" fill="#2563EB"/>
    </g>

    <!-- Row 5: Red-line Error -->
    <g transform="translate(52, 400)">
      <text x="0" y="12" font-size="13" font-weight="600" fill="#0F172A">高风险错误回答率 (红线)</text>
      <rect x="164" y="0" width="76" height="16" rx="4" fill="#FEE2E2"/>
      <text x="170" y="12" font-size="9.5" font-weight="600" fill="#DC2626">零容忍指标</text>
      <text x="360" y="13" font-size="15" font-weight="700" fill="#DC2626" text-anchor="end">≤ 2%</text>
      <text x="0" y="28" font-size="10.5" fill="#64748B">制度期限、金额计算、资格条件等关键信息出现错误的比例。</text>
      <rect x="0" y="36" width="360" height="4" rx="2" fill="#F1F5F9"/>
      <rect x="0" y="36" width="18" height="4" rx="2" fill="#DC2626"/>
    </g>

    <!-- Bottom Highlight Box -->
    <g transform="translate(52, 460)">
      <rect x="0" y="0" width="360" height="62" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#0F172A">🛡️ 准入门禁逻辑 (CI/CD Quality Gate)</text>
      <text x="12" y="36" font-size="10" fill="#64748B">发版前跑通 200+ 离线测试集。若高风险错误率 &gt; 2% 或</text>
      <text x="12" y="50" font-size="10" fill="#64748B">检索 Recall &lt; 90%，触发自动化阻断，严禁带病发版。</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2 ==================== -->
  <g id="Column 2 - Performance &amp; SLA">
    <!-- Card Container -->
    <rect x="444" y="124" width="392" height="512" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)"/>

    <!-- Header -->
    <rect x="460" y="140" width="24" height="24" rx="6" fill="#F5F3FF"/>
    <path d="M473 145L467 153H472L471 159L477 151H472L473 145Z" fill="#7C3AED"/>
    <text x="492" y="152" font-size="15" font-weight="700" fill="#0F172A">B. 性能体验与工程 SLA</text>
    <text x="492" y="165" font-size="10" fill="#94A3B8">Performance &amp; SLA</text>
    
    <rect x="740" y="141" width="80" height="22" rx="11" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="752" y="156" font-size="10" font-weight="700" fill="#2563EB">体验基线 P1</text>
    <line x1="460" y1="174" x2="820" y2="174" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Latency Pipeline Header -->
    <text x="460" y="196" font-size="12" font-weight="700" fill="#0F172A">端到端延迟拆解 (P95 分位数体验标准)</text>
    <text x="460" y="211" font-size="10" fill="#64748B">按最慢 5% 请求衡量，杜绝偶发性严重阻塞。</text>

    <!-- Mini Waterfall Flow Diagram -->
    <g transform="translate(460, 222)">
      <rect x="0" y="0" width="108" height="36" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="15" font-size="9" fill="#64748B">混合检索耗时</text>
      <text x="10" y="29" font-size="11" font-weight="700" fill="#2563EB">P95 ≤ 1.5s</text>

      <line x1="112" y1="18" x2="124" y2="18" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="2 2"/>

      <rect x="128" y="0" width="108" height="36" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="138" y="15" font-size="9" fill="#64748B">首 Token 推理</text>
      <text x="138" y="29" font-size="11" font-weight="700" fill="#7C3AED">P95 ≤ 1.5s</text>

      <line x1="240" y1="18" x2="252" y2="18" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="2 2"/>

      <rect x="256" y="0" width="104" height="36" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
      <text x="264" y="15" font-size="9" fill="#059669">网络传输缓冲</text>
      <text x="264" y="29" font-size="11" font-weight="700" fill="#059669">约 0.5~1.0s</text>
    </g>

    <!-- Big Latency Cards -->
    <g transform="translate(460, 272)">
      <!-- Card 1: TTFT -->
      <rect x="0" y="0" width="174" height="74" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="18" font-size="11" font-weight="600" fill="#0F172A">首字响应时间 P95</text>
      <text x="12" y="45" font-size="20" font-weight="800" fill="#2563EB">≤ 5 秒</text>
      <text x="12" y="62" font-size="9.5" fill="#64748B">消除假死停滞感</text>

      <!-- Card 2: Full Answer -->
      <rect x="186" y="0" width="174" height="74" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="198" y="18" font-size="11" font-weight="600" fill="#0F172A">完整回答时间 P95</text>
      <text x="198" y="45" font-size="20" font-weight="800" fill="#0F172A">≤ 10 秒</text>
      <text x="198" y="62" font-size="9.5" fill="#64748B">流式打字输出完成</text>
    </g>

    <!-- Divider -->
    <line x1="460" y1="360" x2="820" y2="360" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Reliability Header -->
    <text x="460" y="382" font-size="12" font-weight="700" fill="#0F172A">知识库运维与稳定性 (Ops &amp; SLA)</text>
    <text x="460" y="397" font-size="10" fill="#64748B">保障知识动态同步，异常必须透明可追溯。</text>

    <!-- Ops Row 1 -->
    <g transform="translate(460, 410)">
      <rect x="0" y="0" width="360" height="48" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="20" font-size="11.5" font-weight="600" fill="#0F172A">知识同步成功率</text>
      <text x="348" y="22" font-size="16" font-weight="800" fill="#2563EB" text-anchor="end">≥ 98%</text>
      <text x="12" y="36" font-size="9.5" fill="#64748B">合法且可访问资料，成功解析并存入向量库比例。</text>
    </g>

    <!-- Ops Row 2 -->
    <g transform="translate(460, 466)">
      <rect x="0" y="0" width="360" height="48" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="20" font-size="11.5" font-weight="600" fill="#0F172A">同步失败可观察率</text>
      <text x="348" y="22" font-size="16" font-weight="800" fill="#059669" text-anchor="end">100%</text>
      <text x="12" y="36" font-size="9.5" fill="#64748B">所有失败任务均展示失败原因与一键重试入口。</text>
    </g>

    <!-- Ops Row 3 / High Availability SLA -->
    <g transform="translate(460, 522)">
      <rect x="0" y="0" width="360" height="48" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="20" font-size="11.5" font-weight="600" fill="#0F172A">服务高可用与容灾 SLA</text>
      <text x="348" y="22" font-size="16" font-weight="800" fill="#7C3AED" text-anchor="end">99.9%</text>
      <text x="12" y="36" font-size="9.5" fill="#64748B">多模型路由熔断降级 · 向量索引实时双备 · 兜底保底响应</text>
    </g>
  </g>

  <!-- ==================== COLUMN 3 ==================== -->
  <g id="Column 3 - Business Impact &amp; Flywheel">
    <!-- Card Container -->
    <rect x="852" y="124" width="392" height="512" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)"/>

    <!-- Header -->
    <rect x="868" y="140" width="24" height="24" rx="6" fill="#ECFDF5"/>
    <path d="M874 156L878 149L882 153L888 145" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="900" y="152" font-size="15" font-weight="700" fill="#0F172A">C. 业务价值与持续评测飞轮</text>
    <text x="900" y="165" font-size="10" fill="#94A3B8">Business Impact &amp; Flywheel</text>
    
    <rect x="1148" y="141" width="80" height="22" rx="11" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
    <text x="1160" y="156" font-size="10" font-weight="700" fill="#7C3AED">闭环飞轮 P1</text>
    <line x1="868" y1="174" x2="1228" y2="174" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Business Impact 2 Cards -->
    <g transform="translate(868, 184)">
      <!-- Card 1: Self-Resolution -->
      <rect x="0" y="0" width="174" height="82" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="12" y="18" font-size="11" font-weight="600" fill="#1E40AF">自助解决率 (核心ROI)</text>
      <text x="12" y="46" font-size="22" font-weight="800" fill="#2563EB">≥ 70%</text>
      <text x="12" y="64" font-size="9" fill="#3B82F6">无需跳人工咨询即可解决</text>

      <!-- Card 2: Positive Feedback -->
      <rect x="186" y="0" width="174" height="82" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
      <text x="198" y="18" font-size="11" font-weight="600" fill="#065F46">用户正向反馈率</text>
      <text x="198" y="46" font-size="22" font-weight="800" fill="#059669">≥ 80%</text>
      <text x="198" y="64" font-size="9" fill="#10B981">会话点赞占比(监控辅助)</text>
    </g>

    <!-- Divider -->
    <line x1="868" y1="280" x2="1228" y2="280" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Flywheel Section -->
    <text x="868" y="302" font-size="12" font-weight="700" fill="#0F172A">评测飞轮闭环 (Evaluation Flywheel)</text>
    <text x="868" y="317" font-size="10" fill="#64748B">离线门禁拦截 ➔ 生产抽样校准 ➔ Bad Case 反哺切片</text>

    <!-- 5 Flow Steps -->
    <g transform="translate(868, 332)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="14" cy="14" r="11" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
        <text x="14" y="18" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">1</text>
        <text x="34" y="13" font-size="11.5" font-weight="600" fill="#0F172A">200+ 离线测试集构建</text>
        <text x="34" y="26" font-size="9.5" fill="#64748B">覆盖核心规章、易混淆边界与负样本超纲问题</text>
      </g>
      <line x1="14" y1="28" x2="14" y2="36" stroke="#CBD5E1" stroke-width="1.5"/>

      <!-- Step 2 -->
      <g transform="translate(0, 38)">
        <circle cx="14" cy="14" r="11" fill="#FEE2E2" stroke="#FECACA" stroke-width="1"/>
        <text x="14" y="18" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">2</text>
        <text x="34" y="13" font-size="11.5" font-weight="600" fill="#0F172A">发版自动化门禁拦截 (Gate)</text>
        <text x="34" y="26" font-size="9.5" fill="#64748B">Recall ≥90% 且 错误率 ≤2% 脚本全通方可发版</text>
      </g>
      <line x1="14" y1="66" x2="14" y2="74" stroke="#CBD5E1" stroke-width="1.5"/>

      <!-- Step 3 -->
      <g transform="translate(0, 76)">
        <circle cx="14" cy="14" r="11" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
        <text x="14" y="18" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">3</text>
        <text x="34" y="13" font-size="11.5" font-weight="600" fill="#0F172A">小流量灰度上线与基线校准</text>
        <text x="34" y="26" font-size="9.5" fill="#64748B">先开放 10%~20% 真实流量，取得线上首批数据</text>
      </g>
      <line x1="14" y1="104" x2="14" y2="112" stroke="#CBD5E1" stroke-width="1.5"/>

      <!-- Step 4 -->
      <g transform="translate(0, 114)">
        <circle cx="14" cy="14" r="11" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
        <text x="14" y="18" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="middle">4</text>
        <text x="34" y="13" font-size="11.5" font-weight="600" fill="#0F172A">生产日志抽样双评</text>
        <text x="34" y="26" font-size="9.5" fill="#64748B">每周随机抽取 100 条：LLM-as-a-Judge + 人工核验</text>
      </g>
      <line x1="14" y1="142" x2="14" y2="150" stroke="#CBD5E1" stroke-width="1.5"/>

      <!-- Step 5 -->
      <g transform="translate(0, 152)">
        <circle cx="14" cy="14" r="11" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
        <text x="14" y="18" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">5</text>
        <text x="34" y="13" font-size="11.5" font-weight="600" fill="#0F172A">Bad Case 归因与反哺迭代</text>
        <text x="34" y="26" font-size="9.5" fill="#64748B">将线上点踩与缺陷用例回流测试集，优化切片与Prompt</text>
      </g>
    </g>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g id="Footer" transform="translate(36, 646)">
    <rect x="0" y="0" width="1208" height="36" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#0F172A">💡 Evals as the New PRD：</text>
    <text x="160" y="22" font-size="10.5" fill="#475569">大模型的非确定性决定了产品质量只能由评测集定义。我们不以单一大模型榜单跑分为准，以事实忠实度、安全拒答与业务分流率为交付准绳。</text>
    <text x="1194" y="22" font-size="10.5" font-weight="600" fill="#64748B" text-anchor="end">STAR Project  ·  1280 x 700</text>
  </g>
</svg>
